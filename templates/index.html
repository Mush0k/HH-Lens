<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HH-Lens</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .vacancy-card { transition: 0.3s; border-radius: 10px; }
        .vacancy-card:hover { transform: translateY(-5px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .salary { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="mb-4 text-center">Найдено вакансий: {{ vacancies|length }}</h1>
    <div class="row row-cols-1 row-cols-md-2 g-4">
        {% for v in vacancies %}
        <div class="col">
            <div class="card h-100 vacancy-card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ v[1] }}</h5> <h6 class="card-subtitle mb-2 text-muted">{{ v[2] }} | {{ v[5] }}</h6> <p class="salary">
                        {% if v[3] or v[4] %}
                            от {{ v[3] or 0 }} до {{ v[4] or '...' }} руб.
                        {% else %}
                            З/П не указана
                        {% endif %}
                    </p>
                    <p class="card-text text-truncate">{{ v[6] }}</p> <a href="{{ v[8] }}" target="_blank" class="btn btn-primary btn-sm">Открыть на HH</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
